<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaman IPTV Ultimate Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff}
.header{padding:15px;text-align:center;background:linear-gradient(90deg,#22c55e,#06b6d4,#a855f7);font-weight:bold}
.topbar{padding:10px}.topbar input{width:100%;padding:10px;border-radius:8px;border:none}
.player{margin:10px;background:#000;border-radius:12px;padding:20px;text-align:center}
.category-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:15px}
.category-bar button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:15px}
.channel{background:#1e293b;padding:12px;border-radius:10px;cursor:pointer;text-align:center}
.footer{text-align:center;padding:20px}
.light{background:#fff;color:#000}
</style>
</head>
<body>
<div class="header">📺 Zaman IPTV Ultimate Pro</div>

<div class="topbar">
<input id="search" placeholder="Search channels...">
</div>

<div class="player">
<h3>Video Player Area</h3>
<p>Add your own stream URLs later.</p>
<div id="status">Ready</div>
</div>

<div class="category-bar">
<button onclick="setCat('fifa')">🏆 FIFA WORLD CUP</button>
<button onclick="setCat('others')">📺 OTHERS</button>
<button onclick="document.body.classList.toggle('light')">🌙 Theme</button>
</div>

<div id="list"></div>

<div class="footer">
<p>Telegram: @incomesz</p>
</div>

<script>
const channels=[
{name:"Sports 1",cat:"fifa",url:""},
{name:"Sports 2",cat:"fifa",url:""},
{name:"Sports 3",cat:"fifa",url:""},
{name:"Sports 4",cat:"fifa",url:""},
{name:"Sports 5",cat:"fifa",url:""},
{name:"Sports 6",cat:"fifa",url:""},
{name:"Sports 7",cat:"fifa",url:""},
{name:"Sports 8",cat:"fifa",url:""},
{name:"Sports 9",cat:"fifa",url:""},
{name:"Sports 10",cat:"fifa",url:""},
{name:"Sports 11",cat:"fifa",url:""},
{name:"Sports 12",cat:"fifa",url:""},
{name:"Others 1",cat:"others",url:""},
{name:"Others 2",cat:"others",url:""},
{name:"Others 3",cat:"others",url:""},
{name:"Others 4",cat:"others",url:""},
{name:"Others 5",cat:"others",url:""}
];

let cat='fifa';
const list=document.getElementById('list');
const search=document.getElementById('search');

function setCat(c){cat=c;render();}

function render(){
list.innerHTML='';
channels.filter(x=>x.cat===cat)
.filter(x=>x.name.toLowerCase().includes(search.value.toLowerCase()))
.forEach(c=>{
 const d=document.createElement('div');
 d.className='channel';
 d.innerText=c.name;
 d.onclick=()=>alert(c.url ? 'URL configured' : 'Stream URL not added');
 list.appendChild(d);
});
}

search.oninput=render;
render();
</script>
</body>
</html>
