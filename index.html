<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sportz IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
background:#0f1629;
border-bottom:1px solid #222;
}

.logo{
font-weight:bold;
color:#00ff88;
}

.search{
width:40%;
padding:10px;
border-radius:8px;
border:none;
background:#1a2238;
color:white;
}

/* FILTERS */
.filters{
padding:10px 20px;
display:flex;
gap:10px;
}

.btn{
padding:6px 12px;
background:#1a2238;
border-radius:20px;
cursor:pointer;
font-size:13px;
}

.btn.active{
background:#ff2e63;
}

/* CARDS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#111a2e;
border-radius:12px;
padding:15px;
border:1px solid #222;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
border-color:#ff2e63;
}

.tag{
font-size:12px;
padding:3px 8px;
background:#00ff88;
color:black;
border-radius:20px;
display:inline-block;
}

.match{
margin-top:10px;
font-weight:bold;
}

.status{
font-size:12px;
color:#aaa;
margin-top:5px;
}

/* PLAYER */
.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:black;
padding:10px;
display:none;
}

video{
width:100%;
max-height:300px;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">⚽ Sportz IPTV</div>
<input class="search" id="search" placeholder="Search events...">
</div>

<div class="filters">
<div class="btn active" onclick="filter('all')">All</div>
<div class="btn" onclick="filter('cricket')">Cricket</div>
<div class="btn" onclick="filter('football')">Football</div>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="playerBox">
<video id="video" controls autoplay></video>
</div>

<script>

const video = document.getElementById("video");
const grid = document.getElementById("grid");
const playerBox = document.getElementById("playerBox");

let currentFilter = "all";

const events = [
{
title:"World Cup 2026",
type:"football",
status:"LIVE",
url:"https://storage.googleapis.com/xredsox/nbcsn/manifest.m3u8"
},
{
title:"England vs New Zealand",
type:"cricket",
status:"LIVE",
url:"https://storage.googleapis.com/xredsox/nbcsn/manifest.m3u8"
},
{
title:"Pakistan Women vs Bangladesh Women",
type:"cricket",
status:"LIVE",
url:"https://storage.googleapis.com/xredsox/nbcsn/manifest.m3u8"
}
];

function play(url){
playerBox.style.display="block";

if(Hls.isSupported()){
const hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
} else {
video.src = url;
}

video.play();
}

function render(){
grid.innerHTML="";

let q = document.getElementById("search").value.toLowerCase();

events
.filter(e => currentFilter==="all" ? true : e.type===currentFilter)
.filter(e => e.title.toLowerCase().includes(q))
.forEach(e=>{

let div = document.createElement("div");
div.className="card";

div.innerHTML=`
<span class="tag">${e.type.toUpperCase()}</span>
<div class="match">${e.title}</div>
<div class="status">🔴 ${e.status}</div>
`;

div.onclick=()=>play(e.url);

grid.appendChild(div);
});
}

function filter(type){
currentFilter=type;
render();
}

document.getElementById("search").addEventListener("input",render);

render();

</script>

</body>
</html>
