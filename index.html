<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body {
    margin:0;
    background:black;
    text-align:center;
    color:white;
}
video {
    width:100%;
    max-width:900px;
    margin-top:20px;
}
</style>
</head>
<body>

<h2>Live TV Player</h2>

<video id="video" controls autoplay></video>

<script>
const video = document.getElementById('video');

const videoSrc = "https://live.thebosstv.com:30443/dwlive/Somoy-TV/playlist.m3u8";

if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(videoSrc);
    hls.attachMedia(video);
}
else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = videoSrc;
}
</script>

</body>
</html>
