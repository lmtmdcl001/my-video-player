<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Stream Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1100px;
}

.card{
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,.4);
}

.header{
    background:#1e293b;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:28px;
}

.status{
    margin-top:8px;
    color:#22c55e;
    font-size:14px;
}

.player-wrapper{
    position:relative;
    background:#000;
}

video{
    width:100%;
    display:block;
    background:#000;
}

.loader{
    position:absolute;
    top:50%;
    left:50%;
    width:60px;
    height:60px;
    margin-left:-30px;
    margin-top:-30px;
    border:6px solid rgba(255,255,255,0.2);
    border-top:6px solid #22c55e;
    border-radius:50%;
    animation:spin 1s linear infinite;
    z-index:100;
}

.hidden{
    display:none;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.controls{
    padding:15px;
    text-align:center;
    background:#111827;
}

button{
    background:#22c55e;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    opacity:.9;
}

.footer{
    padding:15px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>📺 Live Stream Player</h1>
            <div id="status" class="status">Connecting...</div>
        </div>

        <div class="player-wrapper">

            <div id="loader" class="loader"></div>

            <video
                id="video"
                controls
                autoplay
                playsinline>
            </video>

        </div>

        <div class="controls">
            <button onclick="openFullscreen()">
                ⛶ Full Screen
            </button>
        </div>

        <div class="footer">
            Powered by GitHub Pages
        </div>

    </div>

</div>

<script>

const streamUrl =
"http://198.195.239.50:8095/ptv/tracks-v1a1/mono.m3u8";

const video = document.getElementById("video");
const status = document.getElementById("status");
const loader = document.getElementById("loader");

function showLoader(){
    loader.classList.remove("hidden");
}

function hideLoader(){
    loader.classList.add("hidden");
}

showLoader();

if(Hls.isSupported()){

    const hls = new Hls();

    hls.loadSource(streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {

        hideLoader();

        status.innerHTML = "🟢 LIVE";

        video.play().catch(()=>{});

    });

    hls.on(Hls.Events.ERROR, function(event,data){

        console.log(data);

        hideLoader();

        status.innerHTML =
        "🔴 Stream unavailable or blocked";

    });

}else if(video.canPlayType('application/vnd.apple.mpegurl')){

    video.src = streamUrl;

    video.addEventListener("loadeddata", () => {

        hideLoader();

        status.innerHTML = "🟢 LIVE";

    });

    video.addEventListener("error", () => {

        hideLoader();

        status.innerHTML =
        "🔴 Stream unavailable";

    });

}

function openFullscreen(){

    if(video.requestFullscreen){
        video.requestFullscreen();
    }
    else if(video.webkitRequestFullscreen){
        video.webkitRequestFullscreen();
    }
    else if(video.msRequestFullscreen){
        video.msRequestFullscreen();
    }

}

</script>

</body>
</html>
