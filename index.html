<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.header {
    text-align:center;
    padding:10px;
    background:#222;
}

.container {
    display:flex;
    flex-direction:row;
    height:90vh;
}

.channels {
    width:30%;
    overflow-y:scroll;
    background:#1b1b1b;
}

.channels div {
    padding:10px;
    border-bottom:1px solid #333;
    cursor:pointer;
}

.channels div:hover {
    background:#333;
}

.player {
    width:70%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

video {
    width:95%;
    max-height:80vh;
}
</style>
</head>

<body>

<div class="header">
<h2>My IPTV Player</h2>
</div>

<div class="container">

<div class="channels" id="channelList">
Loading channels...
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

</div>

<script>

// 👇 আপনার M3U লিংক এখানে
const m3uURL = "https://live.thebosstv.com:30443/dwlive/Somoy-TV/playlist.m3u8";

const video = document.getElementById('video');
const channelList = document.getElementById('channelList');

function playStream(url){
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

// শুধু উদাহরণ চ্যানেল (আপনি পরে M3U থেকে অটো লোড করতে পারবেন)
const channels = [
    {name:"Somoy TV", url:m3uURL},
    {name:"Channel 2 (লাইভ টিভি )", https://storage.googleapis.com/xredsox/nbcsn/manifest.m3u8},
    {name:"Channel 3 (Demo)", url:m3uURL}
];

function loadChannels(){
    channelList.innerHTML = "";
    channels.forEach(ch => {
        const div = document.createElement("div");
        div.innerHTML = ch.name;
        div.onclick = () => playStream(ch.url);
        channelList.appendChild(div);
    });
}

loadChannels();
playStream(m3uURL);

</script>

</body>
</html>
