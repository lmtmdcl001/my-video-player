<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO IPTV PLAYER</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:12px;
text-align:center;
background:#111;
font-weight:bold;
}

.player-container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:100%;
max-width:1000px;
height:auto;
background:black;
}

.status{
text-align:center;
padding:8px;
font-size:13px;
color:#aaa;
}
</style>
</head>

<body>

<div class="header">🔥 PRO IPTV SINGLE CHANNEL</div>

<div class="player-container">
<video id="video" controls autoplay></video>
</div>

<div class="status" id="status">Loading stream...</div>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");

const streamURL = "https://storage.googleapis.com/xredsox/nbcsn/manifest.m3u8";

let hls;

function playStream(url){

    if(hls){
        hls.destroy();
        hls = null;
    }

    if(Hls.isSupported()){
        hls = new Hls({
            maxBufferLength: 30
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function(){
            status.innerText = "LIVE ✔ Playing...";
            video.play();
        });

        hls.on(Hls.Events.ERROR, function(){
            status.innerText = "❌ Stream error (blocked or offline)";
        });

    } else {
        video.src = url;
        status.innerText = "Playing (native mode)";
    }
}

playStream(streamURL);

</script>

</body>
</html>
