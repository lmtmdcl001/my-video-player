<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch live TV channels online - Sports, Entertainment, News and more">
    <title>BuddyTV - Live Streaming Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- HLS.js Library for m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-background"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="7" width="20" height="13" rx="2" stroke="currentColor" stroke-width="2" />
                            <path d="M17 2L12 7L7 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <circle cx="8" cy="13" r="1.5" fill="currentColor" />
                            <circle cx="16" cy="13" r="1.5" fill="currentColor" />
                        </svg>
                    </div>
                    <h1>Buddy<span class="logo-accent">TV</span></h1>
                </div>

                <div class="header-right">
                
                    <div class="live-badge">
                        <span class="pulse-dot"></span>
                        LIVE
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Video Player Section -->
            <section class="video-section">
                <div class="video-container">
                    <video id="videoPlayer" class="video-player" controls playsinline>
                        <source src="" type="application/x-mpegURL">
                        Your browser does not support the video tag.
                    </video>
                    <div class="video-overlay" id="videoOverlay">
                        <div class="play-button" id="playButton">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </div>
                        <p class="select-channel-text">Select a channel to start watching</p>
                    </div>
                    <div class="loading-indicator" id="loadingIndicator">
                        <div class="spinner"></div>
                        <p>Loading stream...</p>
                    </div>
                </div>
                <div class="now-playing" id="nowPlaying">
                    <div class="now-playing-content">
                        <span class="now-playing-label">NOW PLAYING</span>
                        <h2 id="currentChannelName">-</h2>
                    </div>
                </div>
            </section>

            <!-- Category Navigation -->
            <section class="category-section">
                <div class="category-nav">
                    <button class="category-btn active" data-category="all">
                        <span>All Channels</span>
</button>
                    <button class="category-btn" data-category="bangla">
                        <span>Bangla</span>
                    </button>
                    <button class="category-btn" data-category="hindi">
                        <span>Hindi</span>
                    </button>
                    <button class="category-btn" data-category="sports">
                        <span>Sports</span>
                    </button>
                    <button class="category-btn" data-category="worldcup">
                        <span>WorldCup</span>
                    </button>
                    <button class="category-btn" data-category="movies">
                        <span>Movies</span>
                    </button>
                </div>
            </section>

            <!-- Channels Grid -->
            <section class="channels-section">
                <h2 class="section-title">Browse Channels</h2>
                <div class="channels-grid" id="channelsGrid">
                    <!-- Channels will be dynamically loaded here -->
                </div>
                <div class="no-results" id="noResults">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                        <path d="M12 6v6M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <p>No channels found</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 BuddyTV. All rights reserved. | Premium Live Streaming Experience</p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>

</html>
